<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Последние годы Константинополя</title>
<meta name="description" content="Пошаговая стратегия: удержите Константинополь в 1444–1453 годах.">
<meta name="theme-color" content="#140b1c">
<style>
:root{
  --bg:#120a18; --bg2:#1c1026; --panel:#231430; --panel2:#2c1a3c; --line:#4a2d5e;
  --purple:#6d2a86; --purple2:#8e3fae; --gold:#d8b45a; --gold2:#f0d78c;
  --text:#efe4cc; --muted:#b9a8c4; --good:#7fcf8a; --bad:#ef7f7f; --warn:#f0b75a;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  background-image:radial-gradient(circle at 50% -10%, #3a1850 0%, rgba(18,10,24,0) 60%);
  background-attachment:fixed;
  color:var(--text);
  font-family:"Palatino Linotype","Book Antiqua",Palatino,Georgia,"Times New Roman",serif;
  font-size:16px; line-height:1.45; min-height:100vh;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:12px 16px 110px}
h1,h2,h3{font-weight:normal;margin:0;color:var(--gold2);letter-spacing:.02em}

/* Шапка */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
.top .title{font-size:20px;color:var(--gold)}
.top .title small{display:block;font-size:13px;color:var(--muted)}
.date{font-size:18px;color:var(--gold2);text-align:right}
.date small{display:block;font-size:13px;color:var(--muted)}
.menu-btn{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--muted)}
.menu-btn:hover{border-color:var(--gold);color:var(--gold2)}

/* Ресурсы */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
@media (min-width:960px){.stats{grid-template-columns:repeat(7,1fr)}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;position:relative}
.stat .lbl{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:4px}
.stat .val{font-size:22px;color:var(--text)}
.stat .d{font-size:13px;margin-left:6px}
.bar{height:5px;background:#120a18;border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple2),var(--gold))}
.stat.threat .bar i{background:linear-gradient(90deg,#c58b3a,#d43c3c)}
.stat.danger{border-color:#a33;box-shadow:0 0 0 1px #a33 inset}
.up{color:var(--good)} .down{color:var(--bad)}

/* Панели */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.panel h2{font-size:18px;margin-bottom:8px}
.report{font-size:14px;color:var(--muted)}
.report b{color:var(--text);font-weight:normal}
.warn{border-color:#8a5a1a;background:#2c1d16;color:#f6d6a0;font-size:14px}
.warn div+div{margin-top:4px}

/* Действия */
.actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.act{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;text-align:left;
  display:flex;flex-direction:column;gap:6px;transition:border-color .15s, transform .1s}
.act:hover:not(:disabled){border-color:var(--gold)}
.act:active:not(:disabled){transform:scale(.99)}
.act.sel{border-color:var(--gold);background:#3a2148;box-shadow:0 0 0 2px var(--gold) inset}
.act:disabled{opacity:.45;cursor:not-allowed}
.act .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.act .n{font-size:17px;color:var(--gold2)}
.act .c{font-size:14px;color:var(--gold);white-space:nowrap}
.act .ds{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12.5px;padding:2px 7px;border-radius:999px;background:#1a0f22;border:1px solid var(--line);white-space:nowrap}
.chip.g{color:var(--good);border-color:#355e3c}
.chip.b{color:var(--bad);border-color:#6a2f2f}

/* Нижняя панель */
.footer{position:fixed;left:0;right:0;bottom:0;background:#150c1e;box-shadow:0 -6px 18px rgba(0,0,0,.45);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:5}
.footer .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.footer .info{font-size:14px;color:var(--muted)}
.footer .info b{color:var(--text);font-weight:normal}
.btn{background:linear-gradient(180deg,#8e3fae,#5e2276);border:1px solid var(--gold);color:var(--gold2);
  border-radius:10px;padding:10px 18px;font-size:16px}
.btn:hover:not(:disabled){filter:brightness(1.15)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.6)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--text)}

/* Летопись */
details.log summary{cursor:pointer;color:var(--gold2);font-size:17px}
.log ul{list-style:none;margin:8px 0 0;padding:0;max-height:300px;overflow:auto;font-size:14px}
.log li{padding:4px 0;border-bottom:1px dashed #3a2548;color:var(--muted)}
.log li b{color:var(--gold);font-weight:normal}

/* Окна */
.overlay{position:fixed;inset:0;background:rgba(8,4,12,.82);display:flex;align-items:center;justify-content:center;
  padding:16px;z-index:10;overflow:auto}
.modal{background:var(--bg2);border:1px solid var(--gold);border-radius:14px;max-width:620px;width:100%;
  padding:18px 18px 16px;box-shadow:0 10px 40px rgba(0,0,0,.6);max-height:calc(100vh - 32px);overflow:auto}
.modal .kicker{font-size:13px;color:var(--gold);text-transform:uppercase;letter-spacing:.12em}
.modal h2{font-size:24px;margin:4px 0 10px}
.modal p{margin:0 0 10px}
.note{font-size:14px;color:var(--muted);font-style:italic;border-left:3px solid var(--purple2);padding:4px 0 4px 10px;margin:10px 0 14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt .t{display:block;color:var(--gold2);margin-bottom:4px}
.opt .why{display:block;font-size:12.5px;color:var(--bad);margin-top:4px}
.result{background:#1a2a1d;border:1px solid #355e3c;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:15px}
.center{text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.eagle{font-size:46px;color:var(--gold);text-align:center;line-height:1;margin:6px 0 8px}
.stage{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--panel)}
.stage.ok{border-color:#355e3c} .stage.fail{border-color:#6a2f2f}
.stage .st{display:flex;justify-content:space-between;gap:8px;color:var(--gold2)}
.stage p{font-size:14.5px;margin:6px 0 0}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
.tbl td{padding:3px 4px;border-bottom:1px dashed #3a2548}
.tbl td:last-child{text-align:right}
.help p,.help li{font-size:15px}
.help ul{padding-left:20px;margin:6px 0 10px}

/* Правители */
.rulers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.ruler{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;font-size:13.5px;color:var(--muted)}
.ruler b{display:block;color:var(--gold2);font-weight:normal;font-size:15.5px}
.ruler i{color:var(--gold);font-style:normal}
.ruler.enemy{border-color:#5e2a2a}

/* Подсказки к ресурсам */
.stat{cursor:help}
.stat .tip{display:none;position:absolute;top:calc(100% + 6px);left:0;width:250px;max-width:80vw;z-index:4;
  background:#120a18;border:1px solid var(--gold);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--text);
  box-shadow:0 6px 20px rgba(0,0,0,.5);line-height:1.4}
.stat.open .tip{display:block}
@media (hover:hover){.stat:hover .tip{display:block}}
.stat .info{font-size:11px;color:var(--muted);opacity:.7}
.stats .stat:nth-child(4n+3) .tip,.stats .stat:nth-child(4n+4) .tip{left:auto;right:0}
@media (min-width:960px){
  .stats .stat .tip{left:0;right:auto}
  .stats .stat:nth-child(n+5) .tip{left:auto;right:0}
}

/* Отложенное событие */
.pending{display:flex;align-items:center;justify-content:space-between;gap:10px;border-color:var(--gold);background:#2d1b3a}
.pending .btn{padding:7px 14px;font-size:15px;white-space:nowrap}

/* Прогноз казны */
.fc{font-size:14.5px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.fc b{color:var(--text);font-weight:normal}
.fc .p{color:var(--good)} .fc .m{color:var(--bad)}
.fc .res{color:var(--gold2);font-size:18px}
.fc .res.neg{color:var(--bad)}
.fc small{font-size:12.5px}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px}

/* Панель кнопок, зал, разработчик */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.speeds{display:flex;flex-direction:column;gap:8px;margin:8px 0 10px}
.toolbar .btn{padding:7px 12px;font-size:15px}
.scene{display:block;width:100%;height:auto;aspect-ratio:10/3;border-radius:8px;margin:2px 0 12px;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.chip .to{opacity:.75}
.lore{color:#fff4cf;border-bottom:1px dotted #f0d78c;cursor:help}
.lore-tip{position:fixed;z-index:50;display:none;gap:10px;align-items:flex-start;background:#120a18;border:1px solid var(--gold);border-radius:10px;
  padding:10px;font-size:13.5px;line-height:1.4;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.6);pointer-events:none}
.lore-tip .portrait{flex:none}
.lore-tip small{color:var(--muted)}
.delta td{padding:4px}
.epi{text-align:left;border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.epi h3{font-size:20px;margin:2px 0 8px;font-weight:normal;color:var(--gold2)}
.hint{display:block;font-size:12.5px;color:var(--muted);margin-top:4px}
.hall{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:6px}
.hall .opt{padding:8px 10px}
.hall-item{display:flex;align-items:center;gap:8px}
.hall-item .portrait{flex:none;border-radius:6px}
.hall-pt{float:left;margin:0 14px 8px 0}
.star{color:#ffd76a;font-size:.9em;text-shadow:0 0 6px rgba(255,215,106,.6)}
.hall .opt .t{margin:0;font-size:15px}
.sel{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:inherit;max-width:100%}

/* Летопись по ходам */
.lg{margin-top:10px}
.lh{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--gold);font-size:14px;letter-spacing:.08em;
  border-bottom:1px solid var(--line);padding-bottom:4px}
.lh .icon-btn{font-size:12.5px;padding:3px 8px;letter-spacing:0}
.log .lg ul{max-height:none;margin-top:4px}
.log ul{max-height:none}
details.log > .lg:first-of-type{margin-top:12px}
#chronicle{max-height:none}
.check{display:block;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:4px 0 6px;cursor:pointer}
.check input{width:18px;height:18px;vertical-align:-3px;margin-right:6px;accent-color:#d8b45a}
.check small{display:block;color:var(--muted);font-size:13px;margin-top:4px}

/* Выбор сложности и вступление */
.diffs{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.diff{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left}
.diff:hover{border-color:var(--gold)}
.diff .t{display:block;color:var(--gold2);font-size:18px}
.diff .d{display:block;font-size:14px;color:var(--muted)}
.diff.main{border-color:var(--gold)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--gold)}
.intro p{text-align:left}
.intro ul{text-align:left;padding-left:20px;margin:6px 0 10px}
.intro li{margin-bottom:6px;font-size:15px}
.icon-btn{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--muted)}
.icon-btn:hover{border-color:var(--gold);color:var(--gold2)}

@media (max-width:600px){
  body{font-size:15px}
  .wrap{padding:10px 16px 120px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat .val{font-size:19px}
  .actions{grid-template-columns:1fr}
  .top .title{font-size:17px}
  .top > div:last-child{width:100%;justify-content:space-between}
  .date{font-size:16px;text-align:left}
  .modal{padding:14px}
  .modal h2{font-size:21px}
  .footer .in{flex-direction:column;align-items:stretch;gap:6px}
  .footer .btn{width:100%}
  .rulers{grid-template-columns:1fr}
  .ruler{padding:6px 10px;font-size:12.5px}
  .ruler b{font-size:14.5px}
  .fc{font-size:13.5px}
}
</style>
</head>

<!-- ============ ЛОГИКА ИГРЫ (без интерфейса) ============ -->
<script id="game-logic">
(function (root) {
'use strict';

var LAST_TURN = 18; // в «Хронографе» ход 18 = январь–март 1453, после него — осада
// Темп: в «Хронографе» ход — полгода, в «Сказании» — сезон (вдвое больше ходов, всё за ход вдвое меньше)
var SPEEDS = {
  half:   { name: 'Хронограф', per: 1, desc: 'Ход — полгода, 19 ходов. Рекомендуется.' },
  season: { name: 'Сказание',  per: 2, desc: 'Ход — сезон, 37 ходов. Больше решений, каждое весит вдвое меньше.' }
};
function P(s) { return (s && s.speed === 'season') ? 2 : 1; }
function lastTurn(s) { return LAST_TURN * P(s); }
function H(s) { return Math.floor(s.t / P(s)); } // номер полугодия — по нему считаются даты событий
// Делим «полугодовую» величину на ходы: в «Сказании» за два сезона в сумме выходит ровно столько же
function per(s, x) {
  if (P(s) === 1 || !x) return x;
  var a = Math.abs(x), v = Math.floor(a / 2) + ((a % 2) && (s.t % 2) ? 1 : 0);
  return x < 0 ? -v : v;
}

// ---------- Генератор случайных чисел (с сохранением состояния) ----------
function rnd(s) {
  var t = s.seed = (s.seed + 0x6D2B79F5) >>> 0;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function rint(s, a, b) { return a + Math.floor(rnd(s) * (b - a + 1)); }
// Отдельный генератор для каждого хода и случая: на «Реальности» перезапуск хода даёт те же события и тот же исход осады
function mix(a, b) {
  var h = (a ^ Math.imul((b + 0x9E3779B9) >>> 0, 0x85EBCA6B)) >>> 0;
  h = Math.imul(h ^ (h >>> 16), 0x7FEB352D) >>> 0;
  h = Math.imul(h ^ (h >>> 15), 0x846CA68B) >>> 0;
  return (h ^ (h >>> 16)) >>> 0;
}
function rngFor(s, salt) { var st = { seed: mix(s.gameSeed >>> 0, salt) }; return function () { return rnd(st); }; }

// ---------- Показатели ----------
var STATS = {
  gold:     { name: 'Казна',            icon: '💰', min: -999, max: 999 },
  walls:    { name: 'Стены',            icon: '🏰', min: 0, max: 100 },
  garrison: { name: 'Гарнизон',         icon: '⚔️', min: 0, max: 20000 },
  west:     { name: 'Помощь Запада',    icon: '⛵', min: 0, max: 100 },
  unity:    { name: 'Единство',         icon: '🤝', min: 0, max: 100 },
  threat:   { name: 'Османская угроза', icon: '🌙', min: 0, max: 100, inverse: true },
  morea:    { name: 'Морея',            icon: '🏛️', min: 0, max: 100 },
  income:   { name: 'Доход',            icon: '📜' }
};
var EFF_ORDER = ['gold', 'income', 'walls', 'garrison', 'west', 'unity', 'threat', 'morea'];

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

function applyEff(s, eff) {
  if (!eff) return;
  for (var k in eff) {
    if (!eff.hasOwnProperty(k)) continue;
    if (k === 'income') { s.incomeMod += eff[k]; continue; }
    if (!STATS[k]) continue;
    s[k] = clamp(s[k] + eff[k], STATS[k].min, STATS[k].max);
  }
}

// Для показа игроку: [{text, good}]
function describeEff(eff) {
  var out = [];
  if (!eff) return out;
  EFF_ORDER.forEach(function (k) {
    if (!eff[k]) return;
    var v = eff[k], st = STATS[k];
    var good = st.inverse ? v < 0 : v > 0;
    var num = (v > 0 ? '+' : '−') + Math.abs(v);
    var label = k === 'income' ? 'Доход ' + num + ' за ход' : st.name + ' ' + num;
    out.push({ text: st.icon + ' ' + label, good: good });
  });
  return out;
}

var QUARTERS = ['январь — март ', 'апрель — июнь ', 'июль — сентябрь ', 'октябрь — декабрь '];
function dateLabel(t, speed) {
  if (speed === 'season') return t >= LAST_TURN * 2 ? 'январь — март 1453' : QUARTERS[t % 4] + (1444 + Math.floor(t / 4));
  var year = 1444 + Math.floor(t / 2);
  if (t >= LAST_TURN) return 'январь — март 1453';
  return (t % 2 === 0 ? 'январь — июнь ' : 'июль — декабрь ') + year;
}
function yearOf(t) { return 1444 + Math.floor(t / 2); }

// ---------- Сложность и правители ----------
// Запасной вариант названий: Легенда / История / Рок
// rewinds: сколько раз можно вернуться в прошлое (-1 — без ограничений); reroll: при возвращении события перетасовываются
var DIFFS = {
  dream:     { name: 'Сон',        icon: '☁️', desc: 'Лёгкий режим: больше золота, султан терпеливее. Можно сколько угодно возвращаться в прошлое — события при этом перетасуются.', gold: 15, income: 2, threat: -1, siege: 0, rewinds: -1, reroll: true },
  reality:   { name: 'Реальность', icon: '⚖️', desc: 'Задуманный баланс: победить трудно, но возможно. Судьба предрешена: события не меняются, вернуться в прошлое можно лишь дважды.', gold: 0, income: 0, threat: 0, siege: 0, rewinds: 2, reroll: false },
  nightmare: { name: 'Кошмар',     icon: '🔥', desc: 'Сложный режим: казна пуста, Мехмед нетерпелив. Вернуться в прошлое нельзя.', gold: -10, income: -1, threat: 1, siege: 0, rewinds: 0, reroll: false }
};
function D(s) { return DIFFS[s.diff] || DIFFS.reality; }

var RULERS = {
  'Иоанн VIII':    { icon: '👑', title: 'Император-дипломат', desc: 'Ездил во Флоренцию ради унии. Посольства на Запад дают +2 к помощи Запада.' },
  'Константин XI': { icon: '⚔️', title: 'Император-воин', desc: 'Бывший деспот Мореи, храбрый полководец. Ремонт стен даёт +3, наёмники — +100 воинов.' },
  'Мурад II':      { icon: '🌙', title: 'Осторожный султан', desc: 'Устал от войн и дважды уступал трон сыну. Угроза растёт медленно, дань ценит.' },

};

function shuffleStart(s) {
  var r = rngFor(s, 777), pool = SHUFFLE.slice(), pick = [];
  for (var i = 0; i < 4; i++) pick.push(pool.splice(Math.floor(r() * pool.length), 1)[0]);
  var eff = {};
  pick.forEach(function (x, i) { eff[x.k] = i < 2 ? x.v : -x.v; });
  applyEff(s, eff);
  s.setupNote = 'Расклад сил: ' + pick[0].plus + ' и ' + pick[1].plus + ', но ' + pick[2].minus + ' и ' + pick[3].minus + '.';
}

function snap(s) { var h = s.history; s.history = null; var j = JSON.stringify(s); s.history = h; return j; }
function rewindsLeft(s) { var d = D(s); return d.rewinds < 0 ? Infinity : Math.max(0, d.rewinds - s.rewindsUsed); }
function canRewind(s) { return rewindsLeft(s) > 0; }

  n.history = s.history.slice(0, t + 1);
  n.rewindsUsed = s.rewindsUsed + 1;
  if (D(n).reroll) n.gameSeed = Math.floor(Math.random() * 4294967296) >>> 0;
  log(n, '<b>↺ Возвращение в прошлое.</b> ' + (D(n).reroll ? 'Судьба перетасована.' : 'Судьба осталась прежней.'));
  startTurn(n);

}

function pickRandomEvent(s, r) {
  var pool = RANDOM.filter(function (e) { return !s.used[e.id] && (!e.cond || e.cond(s)); });
  if (!pool.length) return null;
  var total = 0; pool.forEach(function (e) { total += e.w; });
  var x = r() * total;
  for (var i = 0; i < pool.length; i++) { x -= pool[i].w; if (x <= 0) return pool[i]; }
  return pool[pool.length - 1];
}

function startTurn(s) {
  var r = rngFor(s, s.t * 100 + 1);
  s.queue = [];
  // 1) события с точной датой
  var half = H(s), late = P(s) === 1 || s.t % 2 === 1 || s.t >= lastTurn(s);
  HIST.forEach(function (e) {
    if (e.turn !== half) return;
    var q = e.q === undefined ? 1 : e.q;          // в «Сказании»: 0 — первый сезон полугодия, 1 — второй
    if (P(s) === 1 || s.t % 2 === q) s.queue.push(e.id);
  });
  // 2) союзники за помощь Запада и единство 75 и 100 (приходят обязательно)
  [['west', 'w'], ['unity', 'u']].forEach(function (pair) {
    [75, 100].forEach(function (lvl) {
      var key = pair[1] + lvl;
      if (s[pair[0]] >= lvl && !s.flags[key]) {
        s.flags[key] = true;
        if (lvl === 100) s.flags[pair[0] + 'Max'] = true; // постоянный бонус к штурму
        var left = ALLIES[pair[0]].filter(function (id) { return !s.used[id]; });
        if (left.length) {
          var id = (pair[0] === 'west' && s.flags.burgundyFriend && left.indexOf('burgundy') >= 0) ? 'burgundy' : left[Math.floor(r() * left.length)];
          s.queue.push(id); s.used[id] = true;
        }
      }
    });
  });
  if (s.flags.venFleet && !s.used.loredan_early && half >= 17) { s.queue.push('loredan_early'); s.used.loredan_early = true; }
  if (s.morea >= 100 && !s.flags.moreaMax) { s.flags.moreaMax = true; s.queue.push('morea100'); }
  // 3) сюжетные события с «окном» лет: приходят в случайный ход окна, в последний ход окна — обязательно
  HIST.forEach(function (e) {
    if (e.from === undefined || s.used[e.id] || half < e.from || half > e.to) return;
    var forced = (half >= e.to && late) || s.t >= lastTurn(s);
    var roll = r();
    if (forced || (s.queue.length < MAX_EVENTS && roll < e.p / P(s))) { s.queue.push(e.id); s.used[e.id] = true; }

function resolveEvent(s, idx) {

  applyEff(s, o.eff);
  var msg = null;
  if (o.fn) msg = o.fn(s);
  if (ev.fn) ev.fn(s);
  msg = msg || o.result || null;
  var after = snapshot(s); after.income = income(s);
  var delta = [];
  ['gold', 'income', 'walls', 'garrison', 'west', 'unity', 'threat', 'morea'].forEach(function (k) { if (after[k] !== before[k]) delta.push({ k: k, from: before[k], to: after[k] }); });
  s.lastResult = { title: ev.title, choice: o.text, text: msg, eff: o.eff, delta: delta };
  log(s, '<b>' + ev.title + '.</b> ' + o.text + (msg ? ' — ' + msg : ''));

function chosenCost(s, list) {

}

}

var Sound = (function () {
  var ctx = null, on = true;
  try { on = localStorage.getItem(SOUND_KEY) !== 'off'; } catch (e) {}
  function ac() {
    if (!on) return null;
    if (!ctx) { var C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); }
    if (ctx.state === 'suspended') ctx.resume();

  }
  function tone(freq, at, dur, type, vol) {
    var c = ac(); if (!c) return;
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + (at || 0);
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.1, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  function drum(at, vol) {
    var c = ac(); if (!c) return;
    var t = c.currentTime + (at || 0), o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.4);
    g.gain.setValueAtTime(vol || 0.35, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);

  }

  return {
    isOn: function () { return on; },
    toggle: function () { on = !on; try { localStorage.setItem(SOUND_KEY, on ? 'on' : 'off'); } catch (e) {} if (on) this.click(); },
    click:  function () { tone(700, 0, 0.06, 'triangle', 0.05); },
    select: function () { tone(523, 0, 0.12, 'sine', 0.07); tone(784, 0.05, 0.14, 'sine', 0.05); },
    event:  function () { bell(523, 0); bell(392, 0.35, 0.06); },
    turn:   function () { tone(294, 0, 0.5, 'triangle', 0.08); tone(392, 0.15, 0.6, 'triangle', 0.08); tone(587, 0.3, 0.8, 'triangle', 0.06); },

    lose:   function () { [440, 349, 294, 220].forEach(function (f, i) { tone(f, i * 0.45, 1.3, 'sine', 0.08); }); drum(1.8, 0.3); }
  };
})();

// ---------- Экран партии ----------
function statCard(key, val, prevVal, extra) {
  var st = G.STATS[key];
  var d = prevVal === undefined || prevVal === null ? 0 : val - prevVal;
  var dh = '';
  if (d) {
    var good = st.inverse ? d < 0 : d > 0;
    dh = '<span class="d ' + (good ? 'up' : 'down') + '">' + (d > 0 ? '+' : '−') + Math.abs(d) + '</span>';
  }
  var bar = st.max === 100 ? '<div class="bar"><i style="width:' + Math.max(0, Math.min(100, val)) + '%"></i></div>' : '';
  var danger = (key === 'threat' && val >= 80) || (key === 'unity' && val <= 20) || (key === 'gold' && val < 0) || (key === 'walls' && val < 25);
  return '<div class="stat ' + (key === 'threat' ? 'threat ' : '') + (danger ? 'danger' : '') + '" data-stat="' + key + '">' +
    '<div class="lbl"><span>' + st.icon + ' ' + st.name + '</span><span class="info">ⓘ</span></div>' +
    '<div class="val">' + val + dh + '</div>' + (extra || '') + bar +
    '<div class="tip">' + TIPS[key] + '</div></div>';
}

function rulerCard(name, enemy) {
  var r = G.RULERS[name] || { icon: '', title: '', desc: '' };
  return '<div class="ruler ' + (enemy ? 'enemy' : '') + '"><b>' + r.icon + ' ' + esc(name) + ' <i>· ' + r.title + '</i></b>' + r.desc + '</div>';
}

function renderGame() {
  var s = S, p = s.prev || {};
  var inc = G.income(s), upk = G.upkeep(s), done = s.phase === 'done';
  var h = '<div class="wrap">';
  h += '<div class="top"><div class="title">☩ Последние годы Константинополя<small>Сложность: ' + G.DIFFS[s.diff].name + ' · v' + G.VERSION + '</small></div>' +
       '<div style="display:flex;gap:8px;align-items:center"><div class="date">' + G.dateOf(s) +
       '<small>Ход ' + (s.t + 1) + ' из ' + (G.lastTurn(s) + 1) + ' · ' + G.untilSiege(s) + '</small></div>' +
       '<button class="icon-btn" data-a="sound" aria-label="Звук">' + (Sound.isOn() ? '🔊' : '🔇') + '</button>' +
       '<button class="menu-btn" data-a="menu" aria-label="Меню">☰</button></div></div>';

  // Отложенное событие
  var ev = G.currentEvent(s);
  if (!done && s.phase === 'events' && s.hideEvent && ev) {
    h += '<div class="panel pending"><div>📜 Ждёт вашего решения: <b style="color:var(--gold2);font-weight:normal">' + ev.title + '</b>' +
      (s.queue.length > 1 ? ' (и ещё ' + (s.queue.length - 1) + ')' : '') + '</div><button class="btn" data-a="show-event">Открыть</button></div>';
  }

  h += '<div class="rulers">' + rulerCard(s.ruler) + rulerCard(s.sultan, true) + '</div>';
  h += '<div class="toolbar"><button class="btn ghost" data-a="council">🛡 Военный совет' + (G.councilOpen(s) ? '' : ' 🔒') + '</button>' +
    '<button class="btn ghost" data-a="hall">' + hallBtnLabel() + '</button>' + (DEV ? '<button class="btn ghost" data-a="dev">⚙ Разработчик</button>' : '') + '</div>';

  h += '<div class="stats">' +
    statCard('gold', s.gold, p.gold, '<div class="sub">доход +' + inc + ', войско −' + upk + '</div>') +
    statCard('walls', s.walls, p.walls) +
    statCard('garrison', s.garrison, p.garrison, '<div class="sub">воинов</div>') +
    statCard('west', s.west, p.west) +
    statCard('unity', s.unity, p.unity) +
    statCard('threat', s.threat, p.threat, '<div class="sub">+' + G.threatGrowth(s) + ' за ход</div>') +
    statCard('morea', s.morea, p.morea, '<div class="sub">даёт +' + Math.round(s.morea / 5) + ' дохода</div>') +
    '</div>';

  // Предупреждения
  var w = [];
  if (s.threat >= 80) w.push('🌙 Угроза ' + s.threat + ' из 100. Если она дойдёт до 100 раньше 1453 года, султан нападёт немедленно — и город не будет готов.');
  if (s.unity <= 20) w.push('🤝 Единство ' + s.unity + '. Если оно упадёт до нуля, в городе вспыхнет бунт.');
  if (s.gold < 0) w.push('💰 Казна в долгах. Наёмники уходят. Если долг превысит 25, наступит банкротство.');
  if (w.length && !done) h += '<div class="panel warn"><div>' + w.join('</div><div>') + '</div></div>';

  if (s.report && !done) {
    var r = s.report;
    h += '<div class="panel report">Итоги прошлого хода: доход <b>+' + r.inc + '</b>, жалованье войску <b>−' + r.upk +
      '</b>, стены обветшали на <b>' + r.decay + '</b>, угроза выросла на <b>' + r.tg + '</b>.' +
      (r.notes.length ? '<br>' + r.notes.join('<br>') : '') + '</div>';
  } else if (s.t === 0 && !done) {
    h += '<div class="panel report">Первый ход спокойный: осмотритесь, изучите ресурсы (наведите курсор или нажмите на карточку) и издайте первые указы.' +
      (s.setupNote ? '<br>🎲 <b>' + s.setupNote + '</b>' : '') + '</div>';
  }

  // Указы
  h += '<div class="panel"><h2>Указы — до двух за ход</h2><div class="actions">';
  G.ACTIONS.forEach(function (a) {
    var sel = s.chosen.indexOf(a.id) >= 0;
    var can = !done && (sel || G.canChoose(s, a.id));
    var cost = a.cost(s);
    h += '<button class="act ' + (sel ? 'sel' : '') + '" data-act="' + a.id + '" ' + (can ? '' : 'disabled') + '>' +
      '<div class="h"><span class="n">' + a.icon + ' ' + a.name + '</span><span class="c">' + (cost ? '💰 ' + cost : 'бесплатно') + '</span></div>' +
      '<div class="ds">' + a.desc + '</div>' + chips(a.eff(s)) + '</button>';
  });
  h += '</div></div>';

  // Летопись
  var left = G.rewindsLeft(s);
  h += '<details class="log panel" id="chronicle" ' + (done || s.openLog ? 'open' : '') + '><summary>📖 Летопись' +
    (left > 0 ? ' <small style="color:var(--muted);font-size:13px">· можно вернуться в прошлое: ' + (left === Infinity ? 'без ограничений' : 'осталось ' + left) + '</small>' : '') + '</summary>';
  var groups = [], cur = null;
  s.log.forEach(function (l) {
    var key = l.t === undefined ? l.d : l.t;
    if (!cur || cur.key !== key) { cur = { key: key, t: l.t, d: l.d, items: [] }; groups.push(cur); }
    cur.items.push(l.text);
  });
  groups.forEach(function (g) {
    var can = left > 0 && g.t !== undefined && s.history && s.history[g.t];
    h += '<div class="lg"><div class="lh"><span>' + g.d.toUpperCase() + '</span>' +
      (can ? '<button class="icon-btn" data-rewind="' + g.t + '">↺ вернуться сюда</button>' : '') + '</div><ul>';
    g.items.forEach(function (t) { h += '<li>' + t + '</li>'; });
    h += '</ul></div>';
  });
  h += '</details></div>';

  // Нижняя панель: прогноз казны
  if (done) {
    h += '<div class="footer"><div class="in"><div class="info">Партия окончена: <b>' + G.ENDINGS[s.over.ending].title + '</b></div>' +
      '<button class="btn" data-a="setup">Новая игра</button></div></div>';
  } else {
    var f = G.forecast(s);
    var parts = '<span>💰 <b>' + f.now + '</b></span>';
    if (f.cost) parts += '<span class="m">− ' + f.cost + ' указы</span>';
    if (f.gain) parts += '<span class="p">+ ' + f.gain + ' налог</span>';
    parts += '<span class="p">+ ' + f.inc + ' доход</span><span class="m">− ' + f.upk + ' войско</span>';
    parts += '<span>= <span class="res ' + (f.next < 0 ? 'neg' : '') + '">' + f.next + '</span> <small>к началу следующего хода</small></span>';
    var n = s.chosen.length, blocked = s.queue.length > 0;
    var label = blocked ? 'Сначала ответьте на событие'
      : (s.t >= G.lastTurn(s) ? 'Встретить осаду ▶' : 'Завершить ход ▶' + (n < 2 ? ' (' + (n === 0 ? 'без указов' : '1 указ') + ')' : ''));
    h += '<div class="footer"><div class="in"><div><div class="fc">' + parts + '</div><div class="sub">Указов выбрано: ' + n + ' из 2' +
      (f.next < 0 ? ' · <span style="color:var(--bad)">казна уйдёт в долг!</span>' : '') + '</div></div>' +
      '<button class="btn" data-a="end" ' + (blocked ? 'disabled' : '') + '>' + label + '</button></div></div>';
  }

  h += renderOverlay() + renderPopup();
  app.innerHTML = h;
}

function renderOverlay() {
  var s = S;
  if (s.phase === 'done') return '';
  if (s.lastResult) return resultModal();
  if (s.phase === 'events' && !s.hideEvent) return eventModal();
  if (s.phase === 'siege') return siegeModal();
  if (s.phase === 'over') return endModal();
  return '';
}

// Подсветка первого упоминания людей и мест из Исторического зала
function loreLinks(html, done) {
  HALL.forEach(function (en) {
    if (!en.re || done[en.id]) return;
    var rx = new RegExp('(^|[^А-Яа-яЁё])(' + en.re + ')(?![А-Яа-яЁё])');
    if (rx.test(html)) { done[en.id] = true; html = html.replace(rx, function (m, pre, word) { return pre + '<span class="lore" data-lore="' + en.id + '">' + word + '</span>'; }); }
  });
  return html;
}
function eventModal() {
  var s = S, ev = G.currentEvent(s);
  if (!ev) return '';
  var opts = ev.options(s);
  var h = '<div class="overlay"><div class="modal">' +
    '<div class="kicker">' + (ev.kicker ? '📜 Историческое событие · ' + ev.kicker : (ev.from !== undefined ? '📜 Историческое событие · ' : '⚜ Событие · ') + G.dateOf(s)) + '</div>' +
    '<h2>' + ev.title + '</h2>' + sceneSVG(ev.id) + (function () { var done = {}, t = loreLinks(G.evText(ev, s), done);
      return '<p>' + t + '</p>' + (ev.note ? '<div class="note">' + loreLinks(ev.note, done) + '</div>' : ''); })() + '<div class="opts">';
  opts.forEach(function (o, i) {
    var ok = G.optionAvailable(s, o);
    h += '<button class="opt" data-opt="' + i + '" ' + (ok ? '' : 'disabled') + '><span class="t">' + o.text + '</span>' +
      chips(o.eff, s) + (o.hint ? '<span class="hint">' + o.hint + '</span>' : '') + (ok ? '' : '<span class="why">' + (o.reqText || 'Недоступно') + '</span>') + '</button>';
  });
  return h + '</div><div class="row"><button class="btn ghost" data-a="defer">Отложить решение — посмотреть ресурсы</button></div></div></div>';
}

function resultModal() {
  var r = S.lastResult;
  return '<div class="overlay"><div class="modal">' +
    '<div class="kicker">Решение принято</div><h2>' + r.title + '</h2>' +
    '<div class="result">Вы выбрали: «' + r.choice + '»' + (r.text ? '<br>' + r.text : '') + '</div>' +
    (r.delta && r.delta.length ? '<table class="tbl delta">' + r.delta.map(function (d) {
      var st = G.STATS[d.k], diff = d.to - d.from, good = st.inverse ? diff < 0 : diff > 0;
      return '<tr><td>' + st.icon + ' ' + st.name + (d.k === 'income' ? ' за ход' : '') + '</td><td>' + d.from + ' → <b>' + d.to + '</b> <span class="' + (good ? 'up' : 'down') + '">(' + (diff > 0 ? '+' : '−') + Math.abs(diff) + ')</span></td></tr>';
    }).join('') + '</table>' : '<p style="color:var(--muted);font-size:14px">Ресурсы не изменились.</p>') + '<div class="row"><button class="btn" data-a="ack">Далее</button></div></div></div>';
}

function siegeModal() {
  var s = S, sg = s.siege, n = s.siegeStep, early = s.flags.earlySiege;
  var h = '<div class="overlay"><div class="modal"><div class="kicker">' + (early ? 'Досрочная осада · ' + G.dateOf(s) : 'Весна 1453') + '</div><h2>Осада Константинополя</h2>' + (n === 0 ? sceneSVG('siege') : '');
  if (n === 0) {
    h += (early
      ? '<p>Угроза достигла предела: Мехмед II не стал ждать весны 1453 года. Его армия внезапно встала у стен, а город не успел подготовиться — это серьёзно ослабит оборону. Вас защищают:</p>'
      : '<p>2 апреля 1453 года армия Мехмеда II — около 80 тысяч воинов и десятки пушек — встала у стен. Вас защищают:</p>') +
      '<table class="tbl">' +
      '<tr><td>🏰 Стены</td><td>' + s.walls + '</td></tr>' +
      '<tr><td>⚔️ Гарнизон</td><td>' + s.garrison + (s.flags.moreaHelp ? ' (вкл. 500 из Мореи)' : '') + '</td></tr>' +

      '<tr><td>🤝 Единство</td><td>' + s.unity + '</td></tr>' +
      '<tr><td>🌙 Османская угроза</td><td>' + s.threat + '</td></tr>' +
      '<tr><td>Пушки Урбана</td><td>' + (s.flags.urbanHired ? 'на ваших стенах' : 'у султана') + '</td></tr>' +
      '<tr><td>Джустиниани</td><td>' + (s.flags.giustiniani ? 'в городе' : 'нет') + '</td></tr>' +
      '<tr><td>Цепь Золотого Рога</td><td>' + (s.flags.chain ? 'починена' : 'ржавая') + '</td></tr>' +
      '<tr><td>Инженер Грант</td><td>' + (s.flags.grant ? 'в городе' : 'нет') + '</td></tr>' +
      '</table>' + (s.lateArrivals && s.lateArrivals.length ? '<p class="note">В последний момент успели прийти: ' + s.lateArrivals.join(' и ') + '.</p>' : '');
  }
  for (var i = 0; i < n; i++) {
    var st = sg.stages[i];
    h += '<div class="stage ' + (st.ok ? 'ok' : 'fail') + '"><div class="st"><span>' + st.title + '</span><span>' + (st.ok ? '✔ успех' : '✘ неудача') + '</span></div>' +

  if (view === 'title' || !S) return renderTitle();
  renderGame();
}

function devAction(k) {
  var s = S;
  var add = { gold: ['gold', 50], west: ['west', 20], unity: ['unity', 20], threat: ['threat', -20], walls: ['walls', 20], garrison: ['garrison', 1000] }[k];
  if (add) { var e = {}; e[add[0]] = add[1]; G.applyEff(s, e); return; }
  if (k === 'event') { var id = document.getElementById('devEv').value; s.queue.unshift(id); s.phase = 'events'; s.hideEvent = false; popup = null; return; }
  if (k === 't17') { s.t = 16 * (s.speed === 'season' ? 2 : 1); s.flags.constantine = true; s.ruler = 'Константин XI'; s.flags.mehmed = true; s.sultan = 'Мехмед II'; G.startTurn(s); popup = null; return; }
  if (k === 'siege') { s.t = G.lastTurn(s); s.queue = []; s.phase = 'actions'; s.chosen = []; G.endTurn(s); popup = null; return; }
}

// Какой звук сыграть после изменения состояния
function afterChange(before) {
  var s = S; if (!s) return;
  if (s.phase === 'over' && before !== 'over') { G.ENDINGS[s.over.ending].win ? Sound.win() : Sound.lose(); return; }
  if (s.phase === 'siege' && before !== 'siege') { Sound.siege(); return; }
  if (s.phase === 'events' && !s.hideEvent && !s.lastResult) Sound.event();
}

// ---------- Обработка нажатий ----------
app.addEventListener('change', function (e) { if (e.target.id === 'shuffle') pendingShuffle = e.target.checked; });
app.addEventListener('toggle', function (e) {
  if (e.target.id === 'chronicle' && S) { S.openLog = e.target.open; save(); }
}, true);
app.addEventListener('click', function (e) {
  var stat = e.target.closest('.stat');
  var opened = app.querySelectorAll('.stat.open');
  for (var i = 0; i < opened.length; i++) if (opened[i] !== stat) opened[i].classList.remove('open');
  if (stat) { stat.classList.toggle('open'); return; }

  var b = e.target.closest('button');
  if (!b || b.disabled) return;
  var a = b.getAttribute('data-a');
  var before = S ? S.phase : null;
  if (b.hasAttribute('data-hall')) { hallSel = b.getAttribute('data-hall'); hallMarkViewed(hallSel); Sound.click(); render(); return; }
  if (b.hasAttribute('data-dev')) { devAction(b.getAttribute('data-dev')); save(); render(); return; }
  if (b.hasAttribute('data-rewind')) { rewindTarget = +b.getAttribute('data-rewind'); popup = 'rewind'; Sound.click(); render(); return; }
  if (b.hasAttribute('data-act')) { G.toggleAction(S, b.getAttribute('data-act')); Sound.select(); save(); render(); return; }
  if (b.hasAttribute('data-opt')) { var ce = G.currentEvent(S); if (ce) hallMark(ce.id); G.resolveEvent(S, +b.getAttribute('data-opt')); Sound.click(); save(); render(); return; }
  if (b.hasAttribute('data-diff')) { pendingDiff = b.getAttribute('data-diff'); Sound.click(); render(); return; }
  if (b.hasAttribute('data-speed')) { pendingSpeed = b.getAttribute('data-speed'); Sound.click(); render(); return; }
  Sound.click();
  switch (a) {
    case 'setup': popup = null; view = 'setup'; break;
    case 'to-intro': introPage = 0; view = 'intro'; break;
    case 'continue': S = load(); view = S ? 'game' : 'title'; if (S) afterChange(null); break;
    case 'intro-next': if (introPage < INTRO.length - 1) { introPage++; break; } /* falls through */
    case 'intro-skip': S = G.newGame(null, pendingDiff, pendingShuffle, pendingSpeed); view = 'game'; save(); Sound.turn(); break;
    case 'intro-back': introPage = Math.max(0, introPage - 1); break;
    case 'help': popup = 'help'; break;
    case 'hall': popup = 'hall'; hallSel = null; break;
    case 'hall-back': hallSel = null; break;
    case 'council': popup = 'council'; break;
    case 'dev': popup = 'dev'; break;
    case 'devref': popup = 'devref'; break;
    case 'about': popup = 'about'; break;
    case 'menu': popup = 'menu'; break;
    case 'sound': Sound.toggle(); break;
    case 'confirm-new': popup = 'confirm-new'; break;
    case 'close-popup': popup = null; break;
    case 'to-title': popup = null; view = 'title'; break;
    case 'defer': S.hideEvent = true; save(); break;
    case 'show-event': S.hideEvent = false; save(); Sound.event(); break;
    case 'ack': S.lastResult = null; save(); afterChange(before); break;
    case 'end':
      G.endTurn(S); save(); window.scrollTo(0, 0);
      if (S.phase === 'events' || S.phase === 'actions') Sound.turn();
      afterChange(before); break;
    case 'siege':
      hallMark('siege');
      if (S.siegeStep < S.siege.stages.length) { S.siegeStep++; S.siege.stages[S.siegeStep - 1].ok ? Sound.ok() : Sound.fail(); }
      else { G.siegeDone(S); afterChange(before); }
      save(); break;
    case 'close-end': S.phase = 'done'; save(); break;
    case 'open-log': S.phase = 'done'; S.openLog = true; save(); render(); var c = document.getElementById('chronicle'); if (c) c.scrollIntoView(); return;
    case 'do-rewind': popup = null; S = G.rewind(S, rewindTarget); rewindTarget = null; save(); Sound.turn(); window.scrollTo(0, 0); afterChange(null); break;
  }
  render();
});

// Всплывающая подсказка у подсвеченных имён: наведение мышью или нажатие пальцем
var tip = document.createElement('div');
tip.className = 'lore-tip'; document.body.appendChild(tip);
function showLore(el) {
  var en = HALL.filter(function (x) { return x.id === el.getAttribute('data-lore'); })[0];
  if (!en) return;
  var txt = en.text.length > 260 ? en.text.slice(0, 260).replace(/\s+\S*$/, '') + '…' : en.text;
  tip.innerHTML = (PORTRAITS[en.id] ? portrait(PORTRAITS[en.id], 48) : '') + '<div><b>' + en.title + '</b><br>' + txt + '<br><small>Полностью — в Историческом зале</small></div>';
  var r = el.getBoundingClientRect(), w = Math.min(320, window.innerWidth - 24);
  tip.style.width = w + 'px';
  tip.style.left = Math.max(12, Math.min(window.innerWidth - w - 12, r.left)) + 'px';
  tip.style.display = 'flex';
  var top = r.bottom + 8; if (top + tip.offsetHeight > window.innerHeight - 8) top = r.top - tip.offsetHeight - 8;
  tip.style.top = Math.max(8, top) + 'px';
}
function hideLore() { tip.style.display = 'none'; }
document.addEventListener('mouseover', function (e) { var l = e.target.closest && e.target.closest('.lore'); if (l) showLore(l); });
document.addEventListener('mouseout', function (e) { if (e.target.closest && e.target.closest('.lore')) hideLore(); });
document.addEventListener('click', function (e) { var l = e.target.closest && e.target.closest('.lore'); if (l) { e.stopPropagation(); showLore(l); } else hideLore(); }, true);

render();
})();
</script>
