тии есть будущее.":"A son was born to the emperor — the dynasty has a future.","Аргиропул возглавил школу и продолжил дело Плифона.":"Argyropoulos headed the school and continued Plethon's work.","Крепкие стены. Пушки Урбана — у вас, а не у султана.":"Strong walls. Urban's cannons on your side, not the sultan's.","Чудовищная бомбарда Урбана, которую тянули 60 волов,":"Urban's monstrous bombard, hauled by 60 oxen,","Весы почти не шевелятся: у султана огромный перевес.":"The scales barely move: the sultan has a huge advantage.","Иоганн Грант находит турецкие подкопы один за другим.":"Johannes Grant finds the Turkish mines one after another.","Идея, геймдизайн и историческая редактура — Craiden_x.":"Idea, game design and historical editing — Craiden_x.","Защитники слушают землю, поставив на неё тазы с водой.":"The defenders listen to the ground with bowls of water set upon it.","Весы клонятся к вам, но в бою всё решают часы и случай.":"The scales lean your way, but in battle hours and chance decide.","Внизу экрана — прогноз казны на начало следующего хода.":"At the bottom — the treasury forecast for the start of next turn.","Янычары врываются через полуоткрытую калитку Керкопорта.":"The janissaries burst in through the half-open Kerkoporta gate.","Генуэзские корабли с хлебом прорываются сквозь турецкий флот.":"Genoese grain ships break through the Turkish fleet.","🤝 Единство на пределе: город стоит как один человек при штурме":"🤝 Unity at its peak: the city stands as one in the assault","Подкопы обрушены, сербские рудокопы султана погибли под землёй.":"The mines collapse; the sultan's Serbian miners die underground.","Победить, ни разу не продвигая унию указом и не провозгласив её.":"Win without ever promoting or proclaiming the union.","Код, тексты и иллюстрации созданы при участии Claude (Anthropic).":"Code, texts and illustrations made with Claude (Anthropic).","Ход — сезон, 37 ходов. Больше решений, каждое весит вдвое меньше.":"A turn is a season, 37 turns. More decisions, each worth half as much.","⛵ Запад на пределе: крестоносный дух укрепит защитников при штурме":"⛵ The West at its peak: crusading zeal will steel the defenders","ночная атака брандерами сжигает турецкие суда, перетащенные посуху.":"a night fireship attack burns the Turkish ships dragged overland.","Константин женился на грузинской царевне — приданое пополнило казну.":"Constantine married a Georgian princess — her dowry filled the treasury.","Бургундские рыцари сражались за город — дружба с де Туази окупилась.":"Burgundian knights fought for the city — friendship with de Thoisy paid off.","Император взял в жёны знатную венецианку: Венеция теперь родня трону.":"The emperor married a noble Venetian: Venice is now kin to the throne.","Послы едут в Рим, Венецию и Буду. Султан следит за этим с подозрением.":"Envoys travel to Rome, Venice and Buda. The sultan watches with suspicion.","На «Сне» события при этом перетасуются — судьба может сложиться иначе.":"On «Dream» events are reshuffled — fate may turn out differently.","Три волны штурма — ополченцы, анатолийцы и янычары — разбиваются о стены.":"Three waves of assault — levies, Anatolians and janissaries — break against the walls.","Каменщики латают Феодосиевы стены — тройную линию укреплений длиной 6 км.":"Masons patch the Theodosian Walls — a triple line of fortifications 6 km long.","Игра вернётся к началу этого хода. Всё, что случилось после, будет забыто.":"The game returns to the start of this turn. Everything after will be forgotten.","Деспот Константин ходил походом в Фессалию — последнее наступление ромеев.":"Despot Constantine campaigned in Thessaly — the last Roman offensive.","Ездил во Флоренцию ради унии. Посольства на Запад дают +2 к помощи Запада.":"Went to Florence for the union. Embassies to the West give +2 Western aid.","Сложный режим: казна пуста, Мехмед нетерпелив. Вернуться в прошлое нельзя.":"Hard mode: the treasury is empty, Mehmed impatient. No returning to the past.","Дать волю Марку Эфесскому и Геннадию Схоларию. Народ спокоен, Рим недоволен.":"Give Mark of Ephesus and Gennadios free rein. The people are calm, Rome is not.","Устал от войн и дважды уступал трон сыну. Угроза растёт медленно, дань ценит.":"Weary of war, twice yielded the throne to his son. Threat grows slowly; he values tribute.","Ресурсы на старте перераспределятся: например, войска больше, но стены слабее.":"Starting resources are reshuffled: e.g. more troops but weaker walls.","Деспотат на Пелопоннесе — последняя житница империи. Сильная Морея даёт доход.":"The despotate in the Peloponnese — the empire's last granary. A strong Morea yields income.","💰 Казна в долгах. Наёмники уходят. Если долг превысит 25, наступит банкротство.":"💰 The treasury is in debt. Mercenaries leave. Debt above 25 means bankruptcy.","Наведите курсор на ресурс (на телефоне — нажмите), чтобы узнать, зачем он нужен.":"Hover over a resource (tap on a phone) to learn what it is for.","Итальянские и каталонские отряды. Каждая тысяча воинов стоит 3 золотых в полгода.":"Italian and Catalan companies. Every thousand men costs 3 gold per half-year.","Обложить купцов, монастыри и знать. Деньги нужны, но любви к трону это не прибавит.":"Tax merchants, monasteries and nobles. Money is needed, but the throne won't be loved for it.","обрушивает целые участки стены у ворот Святого Романа. Залатать проломы не успевают.":"brings down whole stretches of wall at the Gate of St Romanus. The breaches cannot be patched in time.","Бывший деспот Мореи, храбрый полководец. Ремонт стен даёт +3, наёмники — +100 воинов.":"Former despot of Morea, a brave commander. Wall repairs give +3, mercenaries +100 men.","Ход — два месяца, 55 ходов. Для неторопливой игры: каждое решение весит втрое меньше.":"A turn is two months, 55 turns. For an unhurried game: each decision is worth a third.","Наследником назван Димитрий Кантакузин — Палеологи и Кантакузины наконец примирились.":"Demetrios Kantakouzenos is named heir — the Palaiologoi and Kantakouzenoi are reconciled at last.","— нынешний император, осторожный дипломат. Его посольства на Запад действуют сильнее.":"— the current emperor, a cautious diplomat. His embassies to the West work better.","Наведите курсор на любой ресурс (на телефоне — нажмите), чтобы узнать, зачем он нужен.":"Hover over any resource (tap on a phone) to learn what it is for.","Молод, честолюбив и одержим Константинополем. Угроза растёт быстро, дань ценит меньше.":"Young, ambitious and obsessed with Constantinople. Threat grows fast; tribute matters less.",": Запад помогает тем охотнее, чем твёрже вы за неё держитесь, а горожане её ненавидят.":": the West helps the more firmly you hold to it, and the citizens hate it.","Мара Бранкович стала императрицей. Мехмед звал её матерью и долго не решался на войну.":"Mara Branković became empress. Mehmed called her mother and long hesitated to make war.","Настоящий Плифон умер в 1452 году, а его «Законы» по приказу патриарха Геннадия сожгли.":"The real Plethon died in 1452, and his «Laws» were burned on Patriarch Gennadios' orders.",". Ответ можно отложить, чтобы свериться с ресурсами, но закончить ход без ответа нельзя.":". You may postpone an answer to check your resources, but you cannot end the turn without one.","Иоанн VIII — дипломат, Константин XI — воин; Мурад II осторожен, Мехмед II — завоеватель.":"John VIII is a diplomat, Constantine XI a warrior; Murad II is cautious, Mehmed II a conqueror.","— на главном экране и в меню. Там же можно включить музыку и выбрать вид главного экрана.":"— on the main screen and in the menu. Music and other options are there too.","Оценка по нынешнему положению дел. Помните: стены ветшают, а угроза до осады ещё вырастет.":"An estimate based on the present state. Remember: walls decay, and the threat will grow before the siege.","Весной 1453 года Мехмед II придёт к стенам. Исход осады решат всё, что вы успеете сделать.":"In the spring of 1453 Mehmed II will come to the walls. Everything you manage to do will decide the siege.","Поддержать Флорентийскую унию 1439 г. с католической церковью. Запад доволен, горожане — нет.":"Support the 1439 Union of Florence with the Catholic Church. The West is pleased, the citizens are not.","Гарнизон, единство горожан, Джустиниани, союзники. Чем ниже угроза, тем меньше армия султана.":"Garrison, civic unity, Giustiniani, allies. The lower the threat, the smaller the sultan's army.","Чаша весов уверенно клонится к вам. Город может не только выстоять, но и перевернуть историю.":"The scales lean firmly your way. The city may not only stand but change history.","Статьи открываются, когда вы встречаете людей и события в игре, и остаются открытыми навсегда.":"Articles unlock when you meet people and events in the game, and stay unlocked forever.","Отчасти так и вышло — только мостом стала Италия, куда бежали греческие учёные после 1453 года.":"In part it happened — only the bridge was Italy, where Greek scholars fled after 1453.","В действительности взаимные анафемы сняли лишь в 1965 году — папа Павел VI и патриарх Афинагор.":"In reality the mutual anathemas were lifted only in 1965 — by Pope Paul VI and Patriarch Athenagoras.","Турецкий подкоп обрушил участок стены у Влахерн. Пролом удалось закрыть, но ценой многих жизней.":"A Turkish mine brought down a stretch of wall at Blachernae. The breach was closed, at the cost of many lives.","— его сын, которому сейчас 12 лет. Когда он придёт к власти, угроза начнёт расти гораздо быстрее.":"— his son, now 12 years old. When he comes to power, the threat will grow much faster.","В действительности эту роль после 1453 года взяла на себя Москва, назвавшая себя «третьим Римом».":"In reality, after 1453 this role passed to Moscow, which called itself the «Third Rome».","Золото и дары для османского двора. Сын Мурада, Мехмед II, будет ценить их меньше, а просить больше.":"Gold and gifts for the Ottoman court. Murad's son Mehmed II will value them less and ask for more.","из 100. Если она дойдёт до 100 раньше 1453 года, султан нападёт немедленно — и город не будет готов.":"of 100. If it reaches 100 before 1453, the sultan attacks at once — and the city will not be ready.","— нынешний султан, опытный и уставший от войн. Угроза при нём растёт медленно, а дань его успокаивает.":"— the current sultan, experienced and weary of war. Under him the threat grows slowly and tribute calms him.","Ядра крошат внешнюю стену, но за ночь защитники заделывают проломы брёвнами, землёй и мешками с шерстью.":"Stone balls shatter the outer wall, but overnight the defenders fill the breaches with timber, earth and sacks of wool.","На «Реальности» судьба предрешена: те же события и та же удача в осаде — изменить можно лишь свои решения.":"On «Reality» fate is fixed: the same events and the same luck in the siege — only your decisions can change.","Отсрочка — тоже победа: каждый лишний год давал надежду, что Запад наконец соберёт настоящий крестовый поход.":"A reprieve is a victory too: every extra year gave hope that the West would finally gather a real crusade.","Константинополь уже отражал османские осады в 1394–1402 и 1422 годах. В вашей истории он устоял и в третий раз.":"Constantinople had already repelled Ottoman sieges in 1394–1402 and 1422. In your story it held a third time.","В реальности флот, обещанный папой и Венецией, опоздал — он узнал о падении города, уже находясь в Эгейском море.":"In reality the fleet promised by the Pope and Venice was too late — it learned of the city's fall while still in the Aegean.","Финансы были бедой поздней Византии: к XV веку её доходы были меньше, чем у одного венецианского купеческого дома.":"Finances were late Byzantium's curse: by the 15th century its revenue was smaller than that of a single Venetian merchant house.","Угроза достигла предела. В действительности осада 1453 года тоже стала ответом на неосторожные шаги Константинополя.":"The threat reached its limit. In reality the siege of 1453 was also a response to Constantinople's careless moves.","Число воинов в городе. Решает исход подземной войны и генерального штурма. Каждая тысяча стоит 3 золотых за полгода.":"The number of soldiers in the city. Decides mine warfare and the general assault. Every thousand costs 3 gold per half-year.","Первый ход спокойный: осмотритесь, изучите ресурсы (наведите курсор или нажмите на карточку) и издайте первые указы.":"The first turn is quiet: look around, study your resources (hover or tap a card) and issue your first decrees.","из восьми (можно и меньше — ради экономии). Цветные метки показывают, что изменится: зелёные — хорошо, красные — плохо.":"out of eight (fewer is fine — to save money). Coloured tags show what will change: green is good, red is bad.","— его брат, деспот Мореи, храбрый воин. Однажды он унаследует трон, и тогда стены и наёмники будут обходиться выгоднее.":"— his brother, despot of Morea, a brave warrior. One day he will inherit the throne, and walls and mercenaries will cost less.","Согласие горожан и духовенства. Делает защитников стойкими при штурме. Падает от унии и налогов. Если упадёт до 0 — бунт.":"Harmony of citizens and clergy. Makes defenders steadfast in the assault. Falls with the union and taxes. At 0 — revolt.","Спор об унии действительно раскалывал общество: многие горожане отказывались ходить в Святую Софию, «осквернённую» унией.":"The union truly split society: many citizens refused to enter Hagia Sophia, «defiled» by the union.","Лёгкий режим: больше золота, султан терпеливее. Можно сколько угодно возвращаться в прошлое — события при этом перетасуются.":"Easy mode: more gold, a more patient sultan. Return to the past as often as you like — events get reshuffled.","Даже в действительности бегство греческих учёных в Италию дало толчок эпохе Возрождения. В вашей истории их ушло ещё больше.":"Even in reality the flight of Greek scholars to Italy spurred the Renaissance. In your story even more of them left.","Турки перетаскивают 70 кораблей посуху в Золотой Рог. Теперь защитникам приходится растягивать силы ещё и вдоль морских стен.":"The Turks drag 70 ships overland into the Golden Horn. Now the defenders must stretch along the sea walls too.","воинов и десятки пушек — встала у стен. Чем спокойнее был султан в последние годы, тем меньше войска он собрал. Вас защищают:":"men and dozens of cannons — stood before the walls. The calmer the sultan was in recent years, the fewer troops he gathered. Your defences:","Задуманный баланс: победить трудно, но возможно. Судьба предрешена: события не меняются, вернуться в прошлое можно лишь дважды.":"The intended balance: winning is hard but possible. Fate is fixed: events don't change, and you can return to the past only twice.","Похожее уже было: после унии 1274 года император Михаил VIII стал так ненавистен, что его отказались хоронить по церковному обряду.":"It had happened before: after the union of 1274 Emperor Michael VIII became so hated that he was refused a church burial.","Феодосиевы стены — главная защита от обстрела и штурма. Со временем ветшают: на 3 за полгода. Важнее всего на этапе «Обстрел стен».":"The Theodosian Walls — the main defence against bombardment and assault. They decay by 3 per half-year. Most important in «Bombardment».","Насколько султан готов к войне. Растёт каждый ход. Чем выше угроза к осаде, тем больше его армия. На 100 султан нападает немедленно.":"How ready the sultan is for war. Grows every turn. The higher the threat at the siege, the bigger his army. At 100 he attacks at once.","Иоанн VIII — дипломат и надеется на помощь Запада. Всерьёз готовить город к обороне начнёт его брат Константин, когда взойдёт на трон.":"John VIII is a diplomat who hopes for Western help. His brother Constantine will seriously prepare the defence once he takes the throne.","Деспотат на Пелопоннесе — последняя житница империи. Каждые 5 пунктов дают +1 к доходу. Если к осаде Морея 60 и выше, она пришлёт 500 воинов.":"The despotate in the Peloponnese — the empire's last granary. Every 5 points give +1 income. At 60+ by the siege, Morea sends 500 men.","Готовность Запада помочь. Нужна для битвы за Золотой Рог и для прихода Джустиниани (от 50 — сам, от 30 — за плату). Растёт от посольств и унии.":"The West's readiness to help. Needed for the Golden Horn battle and for Giustiniani (50+ he comes himself, 30+ for pay). Grows with embassies and the union.","Так произошло и в действительности. Мехмед получил прозвище Фатих — «Завоеватель», а Константинополь стал столицей Османской империи на 470 лет.":"This is what really happened. Mehmed was named Fatih — «the Conqueror», and Constantinople became the Ottoman capital for 470 years.","Похожее уже было: в 1402 году Тамерлан взял в плен султана Баязида I, и Османская держава едва не распалась. Это подарило Константинополю ещё полвека.":"It had happened before: in 1402 Timur captured Sultan Bayezid I and the Ottoman state nearly fell apart. That gave Constantinople another half-century.","Деньги на указы и решения в событиях. Каждый ход приходит доход (он растёт вместе с Мореей) и уходит жалованье войску. Если долг превысит 25 — банкротство.":"Money for decrees and event choices. Each turn brings income (it grows with Morea) and pays the army. Debt above 25 means bankruptcy.","Тысячу лет назад Римская империя владела половиной известного мира. Теперь у ромеев остались лишь Константинополь, несколько островов и Морея на юге Греции.":"A thousand years ago the Roman Empire ruled half the known world. Now the Romans have only Constantinople, a few islands and Morea in southern Greece.","Город, где когда-то жили полмиллиона человек, опустел: за стенами — едва 50 тысяч жителей, сады и развалины. Вокруг — земли османов. Император платит султану дань.":"The city that once held half a million is empty: barely 50,000 people, gardens and ruins within the walls. Ottoman lands all around. The emperor pays the sultan tribute.","От великой Римской империи остался лишь один город, окружённый владениями османов. Вы — император ромеев. У вас девять лет, чтобы подготовиться к неизбежной осаде.":"Of the great Roman Empire only one city remains, surrounded by Ottoman lands. You are the emperor of the Romans. You have nine years to prepare for the inevitable siege.","Пять лет назад, в 1439 году, император Иоанн VIII подписал во Флоренции унию — союз православной и католической церквей — в обмен на обещание военной помощи Запада.":"Five years ago, in 1439, Emperor John VIII signed the union at Florence — joining the Orthodox and Catholic churches — in exchange for a promise of Western military aid.","Терпение султана кончилось раньше, чем вы успели подготовиться. Османская армия подошла к стенам внезапно, и город, не успевший собрать силы, пал после короткой осады.":"The sultan's patience ran out before you were ready. The Ottoman army appeared suddenly, and the unprepared city fell after a short siege.","зависит от угрозы: от 30 до 100 тысяч воинов. Чем спокойнее был Мехмед, тем меньше войска он приведёт. Если угроза к весне 1453 года ниже 15, осады может не быть вовсе.":"depends on the threat: from 30 to 100 thousand men. The calmer Mehmed was, the fewer he brings. If the threat is below 15 by spring 1453, there may be no siege at all.","Угроза достигла предела: Мехмед II не стал ждать весны 1453 года. Его армия внезапно встала у стен, а город не успел подготовиться — это серьёзно ослабит оборону. Вас защищают:":"The threat reached its limit: Mehmed II did not wait for spring 1453. His army suddenly stood before the walls, and the city was not ready — this will badly weaken the defence. Your defences:","в летописи у каждого хода есть кнопка «вернуться сюда». На «Сне» — без ограничений, и события перетасовываются; на «Реальности» — два раза, судьба не меняется; на «Кошмаре» — нельзя.":"each turn in the chronicle has a «return here» button. On «Dream» — unlimited, and events are reshuffled; on «Reality» — twice, fate stays the same; on «Nightmare» — not at all.","После последнего неудачного штурма Мехмед II сжёг осадные машины и увёл армию. В Святой Софии служат благодарственный молебен. Город выиграл время — годы, а может быть, и десятилетия.":"After the last failed assault Mehmed II burned his siege engines and withdrew. A thanksgiving service is sung in Hagia Sophia. The city has won time — years, perhaps decades.","Толпа у монастыря Пантократора перерастает в мятеж. Императора свергают, новые правители спешат признать себя данниками султана, лишь бы не было «латинской ереси». Империя стала тенью.":"The crowd at the Pantokrator monastery turns into a mutiny. The emperor is overthrown; the new rulers hurry to become the sultan's tributaries rather than accept the «Latin heresy». The empire is a shadow.","Каждый ход — полгода или сезон, смотря какой темп вы выбрали. Отвечайте на события и издавайте до двух указов: чините стены, нанимайте воинов, ищите помощи Запада, платите дань султану.":"Each turn is half a year, a season or two months, depending on the pace. Answer events and issue up to two decrees: repair walls, hire soldiers, seek Western aid, pay tribute to the sultan.","долг больше 25 — банкротство; единство 0 — бунт; угроза 100 — султан нападёт немедленно (до воцарения Мехмеда II это сразу поражение, после — досрочная осада, к которой город не готов).":"debt over 25 — bankruptcy; unity 0 — revolt; threat 100 — the sultan attacks at once (before Mehmed II that is instant defeat, after — an early siege the city is not ready for).","Платить наёмникам нечем. Отряды уходят, чиновники разбегаются, а венецианские кредиторы забирают последние доходы таможни. Султан без боя принимает изнурённый город «под своё покровительство».":"There is nothing to pay the mercenaries. Companies leave, officials flee, and Venetian creditors seize the last customs revenue. The sultan takes the exhausted city «under his protection» without a fight.","пройдёт в четыре этапа. Важно всё: стены, гарнизон, помощь Запада, единство, а также особые решения — пушкарь Урбан, цепь Золотого Рога, инженер Грант и кондотьер Джустиниани. Сильная Морея пришлёт подкрепление.":"runs in four stages. Everything matters: walls, garrison, Western aid, unity, and special choices — the gunfounder Urban, the Golden Horn chain, engineer Grant and the condottiere Giustiniani. A strong Morea sends reinforcements.","Город продержался дольше, чем кто-либо смел надеяться. Османы потеряли треть армии, янычары роптали. Стены пали, но многие тысячи горожан успели уйти на венецианских и генуэзских кораблях, увозя книги, иконы и память о Риме.":"The city held longer than anyone dared hope. The Ottomans lost a third of their army; the janissaries grumbled. The walls fell, but many thousands escaped on Venetian and Genoese ships, carrying books, icons and the memory of Rome.","Мистра, а за ней и Константинополь подхватили мечту Плифона. В академии читают Платона наравне с отцами церкви, ромеи всё чаще называют себя эллинами. Церковь хмурится, но новое поколение гордится наследием Афин не меньше, чем Рима.":"Mystras, and then Constantinople, took up Plethon's dream. The academy reads Plato alongside the Church Fathers, and the Romans increasingly call themselves Hellenes. The Church frowns, but the new generation is as proud of Athens as of Rome.","Год за годом греки слали дары, уступали спорные крепости и не давали ни малейшего повода к войне. Мехмед, занятый Анатолией и Балканами, решил, что город никуда не денется. Поход отложен — может быть, на годы. Время работает и на империю, и против неё.":"Year after year the Greeks sent gifts, yielded disputed fortresses and gave no pretext for war. Mehmed, busy with Anatolia and the Balkans, decided the city was going nowhere. The campaign is postponed — perhaps for years. Time works both for and against the empire.","Отбитый штурм совпал с приходом венецианского и папского флотов. Пока Мехмед отступал, Хуньяди перешёл Дунай. Янычары взбунтовались, и молодой султан был свергнут. Империя ромеев вернула Фракию, а в Константинополь съезжаются художники и учёные со всей Европы.":"The repelled assault coincided with the arrival of the Venetian and papal fleets. As Mehmed retreated, Hunyadi crossed the Danube. The janissaries rebelled and the young sultan was overthrown. The Roman Empire regained Thrace, and artists and scholars from all Europe flock to Constantinople.","На рассвете янычары ворвались в город через пролом у ворот Святого Романа. Константин XI сбросил знаки императорского достоинства и погиб в бою как простой воин. Тысячелетняя Римская империя пала. Мехмед II въехал в Святую Софию и приказал обратить её в мечеть.":"At dawn the janissaries broke in through the breach at the Gate of St Romanus. Constantine XI cast off his imperial insignia and died fighting as a simple soldier. The thousand-year Roman Empire fell. Mehmed II rode into Hagia Sophia and ordered it turned into a mosque.","Император сдержал слово, данное папе: в храмах поминают Рим, по улицам ходят латинские священники. Запад щедр на золото и корабли, но город ропщет. Монахи уходят на Афон, в тавернах шепчут о «латинском царе». Победа куплена дорогой ценой, и в стране зреет мятеж.":"The emperor kept his word to the Pope: churches commemorate Rome, Latin priests walk the streets. The West is generous with gold and ships, but the city grumbles. Monks leave for Athos; taverns whisper of the «Latin emperor». Victory came at a high price, and revolt is brewing.","Игра начинается в 1444 году и заканчивается осадой весной 1453-го. Темп «Хронограф»: ход — полгода, 19 ходов. «Сказание»: ход — сезон, 37 ходов. «Летопись»: ход — два месяца, 55 ходов. В медленных темпах доход, расходы и сила указов за ход делятся на два или на три.":"The game begins in 1444 and ends with the siege in spring 1453. «Chronograph» pace: a turn is half a year, 19 turns. «Saga»: a season, 37 turns. «Chronicle»: two months, 55 turns. At slower paces income, costs and decree effects per turn are divided by two or three.","Отбив османов почти без латинской помощи, ромеи поверили в свои силы. Унию тихо забыли, Святая София снова полна. Монастыри Афона и Мистры переживают расцвет: пишут иконы, переписывают книги. Константинополь снова становится сердцем православного мира — от Москвы до Тбилиси.":"Having beaten the Ottomans with little Latin help, the Romans believed in themselves. The union was quietly forgotten, Hagia Sophia is full again. The monasteries of Athos and Mystras flourish: icons are painted, books copied. Constantinople is once more the heart of the Orthodox world — from Moscow to Tbilisi.","Ромеи остались православными, но двери города открыты Западу. Итальянские купцы и художники селятся у Золотого Рога, греческие учёные преподают в Падуе и Флоренции. Константинополь становится мостом между двумя мирами — и, может быть, единственным местом, где они слышат друг друга.":"The Romans stayed Orthodox, but the city's doors are open to the West. Italian merchants and artists settle by the Golden Horn; Greek scholars teach in Padua and Florence. Constantinople becomes a bridge between two worlds — perhaps the only place where they hear each other.","Посольства, диспуты и уступки принесли плоды. Патриарх и папа впервые за четыреста лет обменялись посланиями без проклятий и сняли взаимные анафемы 1054 года. Союз не идеален: многие монахи так и не смирились. Но после отбитой осады в Святой Софии на одной литургии стоят греки и латиняне.":"Embassies, debates and concessions bore fruit. For the first time in four hundred years the Patriarch and the Pope exchanged letters without curses and lifted the mutual anathemas of 1054. The union is imperfect: many monks never accepted it. But after the siege, Greeks and Latins stand at one liturgy in Hagia Sophia.","Мехмед был так уверен в победе, что привёл к стенам меньше пятидесяти тысяч и сам повёл янычар на последний штурм. Когда штурм захлебнулся, ворота Святого Романа распахнулись, конница ромеев ударила во фланг, и в суматохе султанский шатёр оказался в руках защитников. Юный завоеватель — пленник императора. Ценой свободы станут Фракия, отказ от дани и вечный мир.":"Mehmed was so sure of victory that he brought fewer than fifty thousand men and led the janissaries in the last assault himself. When it faltered, the Gate of St Romanus swung open, Roman cavalry struck the flank, and in the confusion the sultan's tent fell to the defenders. The young conqueror is the emperor's prisoner. The price of his freedom: Thrace, an end to tribute and eternal peace.",

var EN_MONTHS = { 'Январь': 'January', 'Февраль': 'February', 'Март': 'March', 'Апрель': 'April', 'Май': 'May', 'Июнь': 'June', 'Июль': 'July', 'Август': 'August', 'Сентябрь': 'September', 'Октябрь': 'October', 'Ноябрь': 'November', 'Декабрь': 'December', 'Весна': 'Spring', 'Лето': 'Summer', 'Осень': 'Autumn', 'Зима': 'Winter', 'январь': 'January', 'февраль': 'February', 'март': 'March', 'апрель': 'April', 'май': 'May', 'июнь': 'June', 'июль': 'July', 'август': 'August', 'сентябрь': 'September', 'октябрь': 'October', 'ноябрь': 'November', 'декабрь': 'December' };
var EN_LIST = Object.keys(EN).sort(function (a, b) { return b.length - a.length; }).map(function (k) {

function enText(t) {
  if (!/[А-Яа-яЁё]/.test(t)) return t;
  t = t.replace(/Ход (\d+) из (\d+)/g, 'Turn $1 of $2');
  t = t.replace(/до осады (\d+) (?:год|года|лет)(?: и (\d+) месяцев)?/g, function (m, y, mo) { return 'siege in ' + y + (y === '1' ? ' year' : ' years') + (mo ? ' ' + mo + ' months' : ''); });
  t = t.replace(/до осады (\d+) месяцев/g, 'siege in $1 months');
  t = t.replace(/(\d+) тысяч(?![а-я])/g, '$1 thousand');
  t = t.replace(/(^|[^А-Яа-яЁё])(январь|февраль|март|апрель|май|июнь|июль|август|сентябрь|октябрь|ноябрь|декабрь|Январь|Февраль|Март|Апрель|Май|Июнь|Июль|Август|Сентябрь|Октябрь|Ноябрь|Декабрь|Весна|Лето|Осень|Зима)(?![А-Яа-яЁё])/g, function (m, p, w) { return p + EN_MONTHS[w]; });
  for (var i = 0; i < EN_LIST.length; i++) {
    var e = EN_LIST[i];
    if (t.indexOf(e[0]) < 0) continue;
    t = t.replace(e[1], function (m, p) { return p + e[2]; });
    if (!/[А-Яа-яЁё]/.test(t)) break;
  }
  return t;
}
function translateDOM(root) {
  if (SETTINGS.lang !== 'en' || !root) return;
  var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), n, list = [];
  while ((n = w.nextNode())) list.push(n);
  list = list.filter(function (x) { var el = x.parentNode; return !(el && el.closest && el.closest('.notr') && !el.closest('.chip')); });
  list.forEach(function (x) { var v = x.nodeValue; if (/[А-Яа-яЁё]/.test(v)) { var r = enText(v); if (r !== v) x.nodeValue = r; } });
}

function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function chips(eff, s) {
  var h = '', keys = ['gold', 'income', 'walls', 'garrison', 'west', 'unity', 'threat', 'morea'].filter(function (k) { return eff && eff[k]; });
  G.describeEff(eff).forEach(function (c, i) {
    var k = keys[i], proj = '';
    if (s && k && k !== 'income') { var st = G.STATS[k], v = Math.max(st.min, Math.min(st.max, s[k] + eff[k])); proj = ' <span class="to">→ ' + v + '</span>'; }
    h += '<span class="chip ' + (c.good ? 'g' : 'b') + '">' + esc(c.text) + proj + '</span>';
  });
  return h ? '<div class="chips">' + h + '</div>' : '';
}

// ---------- Экран партии ----------
function statCard(key, val, prevVal, extra) {
  var st = G.STATS[key];
  var d = prevVal === undefined || prevVal === null ? 0 : val - prevVal;
  var dh = '';
  if (d) {
    var good = st.inverse ? d < 0 : d > 0;
    dh = '<span class="d ' + (good ? 'up' : 'down') + '">' + (d > 0 ? '+' : '−') + Math.abs(d) + '</span>';
  }
  var bar = st.max === 100 ? '<div class="bar"><i style="width:' + Math.max(0, Math.min(100, val)) + '%"></i></div>' : '';
  var danger = (key === 'threat' && val >= 80) || (key === 'unity' && val <= 20) || (key === 'gold' && val < 0) || (key === 'walls' && val < 25);
  var floatTxt = d ? '<span class="float ' + (dh.indexOf('up') >= 0 ? 'up' : 'down') + '">' + (d > 0 ? '+' : '−') + Math.abs(d) + '</span>' : '';
  return '<div class="stat ' + (key === 'threat' ? 'threat ' : '') + (danger ? 'danger ' : '') + (d ? 'pulse' : '') + '" data-stat="' + key + '">' + floatTxt +
    '<div class="lbl"><span>' + st.icon + ' ' + st.name + '</span><span class="info">ⓘ</span></div>' +
    '<div class="val">' + val + dh + '</div>' + (extra || '') + bar +
    '<div class="tip">' + TIPS[key] + '</div></div>';
}

function rulerCard(name, enemy) {
  var r = G.RULERS[name] || { icon: '', title: '', desc: '' };
  var pid = { 'Иоанн VIII': 'john8', 'Константин XI': 'const11', 'Мурад II': 'murad2', 'Мехмед II': 'mehmed2' }[name];
  return '<div class="ruler ' + (enemy ? 'enemy' : '') + '">' + (pid && PORTRAITS[pid] ? portrait(PORTRAITS[pid], 52) : '') +
    '<div><b>' + esc(name) + ' <i>· ' + r.title + '</i></b>' + r.desc + '</div></div>';
}

  var w = [];
  if (s.threat >= 80) w.push('🌙 Угроза ' + s.threat + ' из 100. Если она дойдёт до 100 раньше 1453 года, султан нападёт немедленно — и город не будет готов.');
  if (s.unity <= 20) w.push('🤝 Единство ' + s.unity + '. Если оно упадёт до нуля, в городе вспыхнет бунт.');
  if (s.gold < 0) w.push('💰 Казна в долгах. Наёмники уходят. Если долг превысит 25, наступит банкротство.');
  if (w.length && !done) h += '<div class="panel warn"><div>' + w.join('</div><div>') + '</div></div>';

  if (s.report && !done) {
    var r = s.report;
    h += '<div class="panel report">Итоги прошлого хода: доход <b>+' + r.inc + '</b>, жалованье войску <b>−' + r.upk +
      '</b>, стены обветшали на <b>' + r.decay + '</b>, угроза выросла на <b>' + r.tg + '</b>.' +
      (r.notes.length ? '<br>' + r.notes.join('<br>') : '') + '</div>';
  } else if (s.t === 0 && !done) {
    h += '<div class="panel report">Первый ход спокойный: осмотритесь, изучите ресурсы (наведите курсор или нажмите на карточку) и издайте первые указы.' +
      (s.setupNote ? '<br>🎲 <b>' + s.setupNote + '</b>' : '') + '</div>';
  }

  // Указы
  h += '<div class="panel"><h2>Указы — до двух за ход</h2><div class="actions">';
  G.ACTIONS.forEach(function (a) {
    var sel = s.chosen.indexOf(a.id) >= 0;
    var can = !done && (sel || G.canChoose(s, a.id));
    var cost = a.cost(s);
    h += '<button class="act ' + (sel ? 'sel' : '') + '" data-act="' + a.id + '" ' + (can ? '' : 'disabled') + '>' +
      '<div class="h"><span class="n"><span class="medal">' + a.icon + '</span>' + a.name + '</span><span class="c">' + (cost ? '💰 ' + cost : 'бесплатно') + '</span></div>' +
      '<div class="ds">' + a.desc + '</div>' + chips(a.eff(s)) +
      (sel ? '<svg class="sign' + (justSigned === a.id ? ' anim' : '') + '" viewBox="0 0 120 40" aria-hidden="true"><path d="M4 30 C14 8 22 8 20 26 C19 34 30 12 38 14 C44 16 36 32 46 28 C56 24 58 10 66 16 C72 21 64 30 74 28 C86 25 92 14 116 20" fill="none" stroke="#e8d6a8" stroke-width="2.2" stroke-linecap="round"/></svg>' : '') + '</button>';
  });
  h += '</div></div>';

  // Летопись
  var left = G.rewindsLeft(s);
  h += '<details class="log panel" id="chronicle" ' + (done || s.openLog ? 'open' : '') + '><summary>📖 Летопись' +
    (left > 0 ? ' <small style="color:var(--muted);font-size:13px">· можно вернуться в прошлое: ' + (left === Infinity ? 'без ограничений' : 'осталось ' + left) + '</small>' : '') + '</summary>';
  var groups = [], cur = null;
  s.log.forEach(function (l) {
    var key = l.t === undefined ? l.d : l.t;
    if (!cur || cur.key !== key) { cur = { key: key, t: l.t, d: l.d, items: [] }; groups.push(cur); }
    cur.items.push(l.text);
  });
  groups.forEach(function (g) {
    var can = left > 0 && g.t !== undefined && s.history && s.history[g.t];
    h += '<div class="lg"><div class="lh"><span>' + g.d.toUpperCase() + '</span>' +
      (can ? '<button class="icon-btn" data-rewind="' + g.t + '">↺ вернуться сюда</button>' : '') + '</div><ul>';
    g.items.forEach(function (t) { h += '<li' + (t.indexOf('<b>') >= 0 ? ' class="notr"' : '') + '>' + t + '</li>'; });
    h += '</ul></div>';
  });
  h += '</details></div>';

  // Нижняя панель: прогноз казны
  if (done) {
    h += '<div class="footer"><div class="in"><div class="info">Партия окончена: <b>' + G.ENDINGS[s.over.ending].title + '</b></div>' +
      '<button class="btn" data-a="setup">Новая игра</button></div></div>';
  } else {
    var f = G.forecast(s);
    var parts = '<span>💰 <b>' + f.now + '</b></span>';
    if (f.cost) parts += '<span class="m">− ' + f.cost + ' указы</span>';
    if (f.gain) parts += '<span class="p">+ ' + f.gain + ' налог</span>';
    parts += '<span class="p">+ ' + f.inc + ' доход</span><span class="m">− ' + f.upk + ' войско</span>';
    parts += '<span>= <span class="res ' + (f.next < 0 ? 'neg' : '') + '">' + f.next + '</span> <small>к началу следующего хода</small></span>';
    var n = s.chosen.length, blocked = s.queue.length > 0;
    var label = blocked ? 'Сначала ответьте на событие'
      : (s.t >= G.lastTurn(s) ? 'Встретить осаду ▶' : 'Завершить ход ▶' + (n < 2 ? ' (' + (n === 0 ? 'без указов' : '1 указ') + ')' : ''));
    h += '<div class="footer"><div class="in"><div><div class="fc">' + parts + '</div><div class="sub">Указов выбрано: ' + n + ' из 2' +
      (f.next < 0 ? ' · <span style="color:var(--bad)">казна уйдёт в долг!</span>' : '') + '</div></div>' +
      '<button class="btn" data-a="end" ' + (blocked ? 'disabled' : '') + '>' + label + '</button></div></div>';
  }

  h += renderOverlay() + renderPopup();
  app.innerHTML = h;
}

function renderOverlay() {
  var s = S;
  if (s.phase === 'done') return '';
  if (s.lastResult) return resultModal();
  if (s.phase === 'events' && !s.hideEvent) return eventModal();
  if (s.phase === 'siege') return siegeModal();
  if (s.phase === 'over') return endModal();
  return '';
}

// Подсветка первого упоминания людей и мест из Исторического зала
function loreLinks(html, done) {
  HALL.forEach(function (en) {
    if (!en.re || done[en.id]) return;
    var rx = new RegExp('(^|[^А-Яа-яЁё])(' + en.re + ')(?![А-Яа-яЁё])');
    if (rx.test(html)) { done[en.id] = true; html = html.replace(rx, function (m, pre, word) { return pre + '<span class="lore" data-lore="' + en.id + '">' + word + '</span>'; }); }
  });
  return html;
}
function eventModal() {
  var s = S, ev = G.currentEvent(s);
  if (!ev) return '';
  var opts = ev.options(s);
  var h = '<div class="overlay' + (arriving ? ' arrive' : '') + '"><div class="modal">' +
    '<div class="kicker">' + (ev.kicker ? '📜 Историческое событие · ' + ev.kicker : (ev.from !== undefined ? '📜 Историческое событие · ' : '⚜ Событие · ') + G.dateOf(s)) + '</div>' +
    '<h2 class="notr">' + ev.title + '</h2>' + sceneSVG(ev.id) + (function () { var done = {}, t = loreLinks(G.evText(ev, s), done);

    '<div class="mini">' + ['gold', 'walls', 'garrison', 'west', 'unity', 'threat', 'morea'].map(function (k) { return '<span title="' + G.STATS[k].name + '">' + G.STATS[k].icon + ' ' + s[k] + '</span>'; }).join('') + '</div>' +
    '<div class="opts">';
  opts.forEach(function (o, i) {
    var ok = G.optionAvailable(s, o);
    h += '<button class="opt" data-opt="' + i + '" ' + (ok ? '' : 'disabled') + '><span class="t notr">' + o.text + '</span>' +
      chips(o.eff, s) + (o.hint ? '<span class="hint notr">' + o.hint + '</span>' : '') + (ok ? '' : '<span class="why">' + (o.reqText || 'Недоступно') + '</span>') + '</button>';
  });
  return h + '</div><div class="row"><button class="btn ghost" data-a="defer">Отложить решение — посмотреть ресурсы</button></div></div></div>';
}

function resultModal() {

  return '<div class="overlay"><div class="modal">' +
    '<div class="kicker">Решение принято</div><h2 class="notr">' + r.title + '</h2>' +
    '<div class="result">Вы выбрали: «<span class="notr">' + r.choice + '</span>»' + (r.text ? '<br><span class="notr">' + r.text + '</span>' : '') + '</div>' +
    (r.delta && r.delta.length ? '<table class="tbl delta">' + r.delta.map(function (d) {

      return '<tr><td>' + st.icon + ' ' + st.name + (d.k === 'income' ? ' за ход' : '') + '</td><td>' + d.from + ' → <b>' + d.to + '</b> <span class="' + (good ? 'up' : 'down') + '">(' + (diff > 0 ? '+' : '−') + Math.abs(diff) + ')</span></td></tr>';
    }).join('') + '</table>' : '<p style="color:var(--muted);font-size:14px">Ресурсы не изменились.</p>') + '<div class="row"><button class="btn" data-a="ack">Далее</button></div></div></div>';

        '<p>Иоанн VIII — дипломат и надеется на помощь Запада. Всерьёз готовить город к обороне начнёт его брат Константин, когда взойдёт на трон.</p>' +
        '<div class="row"><button class="btn" data-a="close-popup">Понятно</button></div></div></div>';
    }
    var om = G.omen(S), ch = '';

  if (!SETTINGS.anim) return;

  var ring = document.createElement('div'); ring.className = 'seal-ring'; document.body.appendChild(ring);
  var d = document.createElement('div'); d.className = 'seal';
  d.innerHTML = '<svg viewBox="0 0 100 100" width="120" height="120"><path d="M50 4 C62 6 66 2 74 10 C84 12 86 20 92 28 C96 38 94 44 96 52 C94 62 98 68 90 76 C86 86 76 86 70 92 C60 96 54 94 46 96 C36 94 30 98 22 90 C12 86 12 76 8 70 C4 60 6 54 4 46 C6 36 2 30 10 22 C14 12 24 12 30 8 C38 4 44 6 50 4 Z" fill="#8e1c1c"/>' +
    '<circle cx="50" cy="50" r="32" fill="none" stroke="#5a0e0e" stroke-width="3"/><circle cx="50" cy="50" r="26" fill="#a02424"/>' +
    '<path d="M46 30 h8 v40 h-8 z M30 46 h40 v8 h-40 z" fill="#5a0e0e"/><path d="M34 22 q16 -8 32 0" stroke="#c84a4a" stroke-width="2" fill="none" opacity=".6"/></svg>';
  document.body.appendChild(d);
  setTimeout(function () { d.classList.add('out'); dim.classList.add('out'); }, 1050);
  setTimeout(function () { [d, ring, dim].forEach(function (x) { if (x.parentNode) x.parentNode.removeChild(x); }); }, 2100);
}

// Какой звук сыграть после изменения состояния
function afterChange(before) {
  var s = S; if (!s) return;
  if (s.phase === 'over' && before !== 'over') { G.ENDINGS[s.over.ending].win ? Sound.win() : Sound.lose(); return; }
  if (s.phase === 'siege' && before !== 'siege') { Sound.siege(); return; }
  if (s.phase === 'events' && !s.hideEvent && !s.lastResult) Sound.event();
}

// ---------- Обработка нажатий ----------
app.addEventListener('change', function (e) { if (e.target.id === 'shuffle') pendingShuffle = e.target.checked; });
app.addEventListener('toggle', function (e) {
  if (e.target.id === 'chronicle' && S) { S.openLog = e.target.open; save(); }
}, true);
app.addEventListener('click', function (e) {
  var stat = e.target.closest('.stat');
  var opened = app.querySelectorAll('.stat.open');
  for (var i = 0; i < opened.length; i++) if (opened[i] !== stat) opened[i].classList.remove('open');
  if (stat) { stat.classList.toggle('open'); return; }

  Music.gesture();
  var b = e.target.closest('button');
  if (!b || b.disabled) { Music.sync(); return; }
  var a = b.getAttribute('data-a');
  var before = S ? S.phase : null;
  if (b.hasAttribute('data-lang')) { SETTINGS.lang = b.getAttribute('data-lang'); saveSettings(); Sound.click(); render(); return; }
  if (b.hasAttribute('data-color')) { SETTINGS.color = b.getAttribute('data-color'); saveSettings(); Sound.select(); render(); return; }
  if (b.hasAttribute('data-bg')) { SETTINGS.bg = b.getAttribute('data-bg'); saveSettings(); Sound.click(); render(); return; }
  if (b.hasAttribute('data-track')) { SETTINGS.track = b.getAttribute('data-track'); SETTINGS.music = true; saveSettings(); render(); Music.sync(); return; }
  if (b.hasAttribute('data-title')) { SETTINGS.title = b.getAttribute('data-title'); saveSettings(); Sound.click(); render(); return; }
  if (b.hasAttribute('data-tab')) { hallTab = b.getAttribute('data-tab'); Sound.page(); render(); return; }
  if (b.hasAttribute('data-hall')) { hallSel = b.getAttribute('data-hall'); hallMarkViewed(hallSel); Sound.page(); render(); return; }
  if (b.hasAttribute('data-dev')) { devAction(b.getAttribute('data-dev')); save(); render(); return; }
  if (b.hasAttribute('data-rewind')) { rewindTarget = +b.getAttribute('data-rewind'); popup = 'rewind'; Sound.click(); render(); return; }
  if (b.hasAttribute('data-act')) { var aid = b.getAttribute('data-act'), wasSel = S.chosen.indexOf(aid) >= 0; G.toggleAction(S, aid);
    var nowSel = S.chosen.indexOf(aid) >= 0; justSigned = nowSel && !wasSel ? aid : null;
    if (wasSel) Sound.unselect(); else if (nowSel) { Sound.select(); Sound.quill(); } save(); render(); justSigned = null; return; }
  if (b.hasAttribute('data-opt')) { var ce = G.currentEvent(S); if (ce) hallMark(ce.id); G.resolveEvent(S, +b.getAttribute('data-opt')); if (S.lastResult && S.lastResult.delta && S.lastResult.delta.some(function (d) { return d.k === 'gold' && d.to > d.from; })) Sound.coin(); else Sound.confirm(); save(); render(); checkAchievements(); return; }
  if (b.hasAttribute('data-diff')) { pendingDiff = b.getAttribute('data-diff'); Sound.click(); render(); return; }
  if (b.hasAttribute('data-speed')) { pendingSpeed = b.getAttribute('data-speed'); Sound.click(); render(); return; }
  Sound.click();
  switch (a) {
    case 'setup': popup = null; view = 'setup'; break;
    case 'to-intro': introPage = 0; view = 'intro'; break;
    case 'continue': S = load(); view = S ? 'game' : 'title'; if (S) afterChange(null); break;
    case 'intro-next': if (introPage < INTRO.length - 1) { introPage++; break; } /* falls through */
    case 'intro-skip': S = G.newGame(null, pendingDiff, pendingShuffle, pendingSpeed); view = 'game'; save(); Sound.turn(); break;
    case 'intro-back': introPage = Math.max(0, introPage - 1); break;
    case 'help': popup = 'help'; break;
    case 'hall': popup = 'hall'; hallSel = null; Sound.page(); break;
    case 'hall-back': hallSel = null; break;
    case 'council': popup = 'council'; break;
    case 'dev': popup = 'dev'; break;
    case 'devref': popup = 'devref'; break;
    case 'about': popup = 'about'; break;
    case 'ach': popup = 'ach'; break;
    case 'settings': popup = 'settings'; break;
    case 'lang': SETTINGS.lang = SETTINGS.lang === 'en' ? 'ru' : 'en'; saveSettings(); break;
    case 'music': SETTINGS.music = !SETTINGS.music; saveSettings(); break;
    case 'muteall': var anyOn = Sound.isOn() || SETTINGS.music; if (Sound.isOn() === anyOn) Sound.toggle(); SETTINGS.music = !anyOn; if (!anyOn && !Sound.isOn()) Sound.toggle(); saveSettings(); break;
    case 'amb': SETTINGS.ambience = !SETTINGS.ambience; saveSettings(); break;
    case 'anim': SETTINGS.anim = !SETTINGS.anim; saveSettings(); break;
    case 'vol': SETTINGS.volume = SETTINGS.volume >= 1 ? 0.25 : Math.round((SETTINGS.volume + 0.25) * 100) / 100; saveSettings(); Music.volume(); break;
    case 'menu': popup = 'menu'; break;
    case 'sound': Sound.toggle(); break;
    case 'confirm-new': popup = 'confirm-new'; break;
    case 'close-popup': popup = null; break;
    case 'to-title': popup = null; view = 'title'; break;
    case 'defer': S.hideEvent = true; save(); break;
    case 'show-event': S.hideEvent = false; save(); Sound.event(); break;
    case 'ack': S.lastResult = null; save(); afterChange(before); break;
    case 'end':
      if (endLock) return;
      if (SETTINGS.anim) {
        endLock = true; stampSeal(); setTimeout(Sound.seal, 380);
        setTimeout(function () { endLock = false; finishEnd(before); }, 1250);
        return;
      }
      Sound.seal(); finishEnd(before); return;
    case 'siege':
      hallMark('siege');
      if (S.siegeStep < S.siege.stages.length) { S.siegeStep++; S.siege.stages[S.siegeStep - 1].ok ? Sound.ok() : Sound.fail(); }
      else { G.siegeDone(S); afterChange(before); }
      save(); break;
    case 'close-end': S.phase = 'done'; save(); break;
    case 'open-log': S.phase = 'done'; S.openLog = true; save(); render(); var c = document.getElementById('chronicle'); if (c) c.scrollIntoView(); return;
    case 'do-rewind': popup = null; S = G.rewind(S, rewindTarget); rewindTarget = null; save(); Sound.turn(); window.scrollTo(0, 0); afterChange(null); break;
  }
  render();
  if (a === 'siege' && S && S.phase === 'siege') { var sm = app.querySelector('.overlay .modal'); if (sm) sm.scrollTop = sm.scrollHeight; }
  checkAchievements();
  Music.sync();
  try { Ambience.set(currentSceneKey()); } catch (e) {}
});

// Всплывающая подсказка у подсвеченных имён: наведение мышью или нажатие пальцем
var tip = document.createElement('div');
tip.className = 'lore-tip'; document.body.appendChild(tip);
function showLore(el) {
  var en = HALL.filter(function (x) { return x.id === el.getAttribute('data-lore'); })[0];
  if (!en) return;
  var txt = en.text.length > 260 ? en.text.slice(0, 260).replace(/\s+\S*$/, '') + '…' : en.text;
  tip.innerHTML = (PORTRAITS[en.id] ? portrait(PORTRAITS[en.id], 48) : '') + '<div><b class="notr">' + en.title + '</b><br><span class="notr">' + txt + '</span><br><small>Полностью — в Историческом зале</small></div>';
  var r = el.getBoundingClientRect(), w = Math.min(320, window.innerWidth - 24);
  tip.style.width = w + 'px';
  tip.style.left = Math.max(12, Math.min(window.innerWidth - w - 12, r.left)) + 'px';
  translateDOM(tip); tip.style.display = 'flex';
  var top = r.bottom + 8; if (top + tip.offsetHeight > window.innerHeight - 8) top = r.top - tip.offsetHeight - 8;
  tip.style.top = Math.max(8, top) + 'px';
}
function hideLore() { tip.style.display = 'none'; }
document.addEventListener('mouseover', function (e) { var l = e.target.closest && e.target.closest('.lore'); if (l) showLore(l); });
document.addEventListener('mouseout', function (e) { if (e.target.closest && e.target.closest('.lore')) hideLore(); });
document.addEventListener('click', function (e) { var l = e.target.closest && e.target.closest('.lore'); if (l) { e.stopPropagation(); showLore(l); } else hideLore(); }, true);

render();
})();
</script>
